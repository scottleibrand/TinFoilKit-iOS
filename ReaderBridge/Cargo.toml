[package]
name = "tfk-reader"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "xz"] }
zimru = { path = "../.build/zimru", default-features = false }
zstd = { version = "=0.13.5", default-features = false }
